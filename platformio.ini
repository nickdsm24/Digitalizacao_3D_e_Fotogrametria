[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = 
    -D USE_NIMBLE
lib_deps = 
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    https://github.com/T-vK/ESP32-BLE-Keyboard.git
    h2zero/NimBLE-Arduino@^1.4.1 